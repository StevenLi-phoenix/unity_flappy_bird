name: WebGL to itch.io
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: itch-production
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/*.test.mjs
      - name: Check Unity CI credentials
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            test -n "${!name}" || { echo "Missing repository secret: $name. See docs/HANDOFF.md"; exit 1; }
          done
      - uses: actions/cache@v4
        with:
          path: FlappyBird/Library
          key: unity-webgl-${{ hashFiles('FlappyBird/ProjectSettings/ProjectVersion.txt', 'FlappyBird/Packages/packages-lock.json') }}-${{ github.sha }}
          restore-keys: |
            unity-webgl-${{ hashFiles('FlappyBird/ProjectSettings/ProjectVersion.txt', 'FlappyBird/Packages/packages-lock.json') }}-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: FlappyBird
          unityVersion: 6000.6.0f1
          targetPlatform: WebGL
          buildMethod: BuildGame.BuildWebGL
          versioning: None
      - run: node scripts/check-webgl.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: webgl-${{ github.sha }}
          path: FlappyBird/Build/WebGL
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: itch-production
      url: https://stevenli-phoenix-work.itch.io/flappy-bird
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: webgl-${{ github.sha }}
          path: webgl
      - name: Install official butler
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://broth.itch.zone/butler/linux-amd64/15.31.0/archive/default -o "$RUNNER_TEMP/butler.zip"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          "$RUNNER_TEMP/butler/butler" version
      - name: Publish browser channel
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$BUTLER_API_KEY" || { echo 'Missing BUTLER_API_KEY repository secret'; exit 1; }
          test -f webgl/index.html
          "$RUNNER_TEMP/butler/butler" push webgl stevenli-phoenix-work/flappy-bird:html5 --userversion "$GITHUB_SHA"
          "$RUNNER_TEMP/butler/butler" status stevenli-phoenix-work/flappy-bird:html5
